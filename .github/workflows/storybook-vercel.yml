name: Storybook — Deploy to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'packages/design-system/industry/web/**'
      - 'packages/design-system/industry/mobile/**'
      - 'packages/design-system/industry/tokens/**'
  workflow_dispatch:

jobs:
  deploy:
    name: ${{ matrix.display_name }} → Vercel
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: '@industry/web'
            path: packages/design-system/industry/web
            display_name: Industry Web
            project_id_secret: VERCEL_PROJECT_ID_INDUSTRY_WEB
          - workspace: '@industry/mobile'
            path: packages/design-system/industry/mobile
            display_name: Industry Mobile
            project_id_secret: VERCEL_PROJECT_ID_INDUSTRY_MOBILE

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npx yarn install

      - name: Build tokens
        run: yarn workspace @industry/tokens build

      - name: Build Storybook
        run: yarn workspace ${{ matrix.workspace }} build-storybook

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        working-directory: ${{ matrix.path }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build Output API v3: hand Vercel the already-built static site so it
      # never runs an install or build of its own. Keeps the monorepo's yarn
      # workspace resolution (and the mobile Storybook's react-native-web
      # aliasing) on the runner, where CI already proves it works.
      - name: Stage prebuilt output
        working-directory: ${{ matrix.path }}
        run: |
          rm -rf .vercel/output
          mkdir -p .vercel/output/static
          cp -R storybook-static/. .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json

      - name: Deploy to Vercel
        id: deploy
        working-directory: ${{ matrix.path }}
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Add URL to job summary
        run: |
          echo "## ${{ matrix.display_name }} Storybook" >> $GITHUB_STEP_SUMMARY
          echo "[${{ steps.deploy.outputs.url }}](${{ steps.deploy.outputs.url }})" >> $GITHUB_STEP_SUMMARY
