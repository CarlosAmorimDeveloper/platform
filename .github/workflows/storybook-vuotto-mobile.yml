name: Storybook Vuotto Mobile — Chromatic Deploy

on:
  push:
    branches:
      - main
    paths:
      - "packages/design-system/vuotto-mobile/**"
      - "packages/design-system/vuotto-tokens/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/design-system/vuotto-mobile/**"
      - "packages/design-system/vuotto-tokens/**"

jobs:
  chromatic:
    permissions:
      pull-requests: write
    uses: ./.github/workflows/storybook-chromatic.yml
    with:
      package_path: packages/design-system/vuotto-mobile
      tokens_path: packages/design-system/vuotto-tokens
      display_name: Vuotto Mobile
      emoji: "📱"
    secrets:
      chromatic_project_token: ${{ secrets.CHROMATIC_PROJECT_TOKEN_VUOTTO_MOBILE }}
