name: Storybook Industry Mobile — Chromatic Deploy

on:
  push:
    branches:
      - main
    paths:
      - "packages/design-system/industry-mobile/**"
      - "packages/design-system/industry-tokens/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/design-system/industry-mobile/**"
      - "packages/design-system/industry-tokens/**"

jobs:
  chromatic:
    uses: ./.github/workflows/storybook-chromatic.yml
    with:
      package_path: packages/design-system/industry-mobile
      tokens_path: packages/design-system/industry-tokens
      display_name: Industry Mobile
      emoji: "📱"
    secrets:
      chromatic_project_token: ${{ secrets.CHROMATIC_PROJECT_TOKEN_INDUSTRY_MOBILE }}
