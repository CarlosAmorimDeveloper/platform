name: Storybook Vuotto Web — Chromatic Deploy

on:
  push:
    branches:
      - main
    paths:
      - "packages/design-system/vuotto-web/**"
      - "packages/design-system/vuotto-tokens/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/design-system/vuotto-web/**"
      - "packages/design-system/vuotto-tokens/**"

jobs:
  chromatic:
    uses: ./.github/workflows/storybook-chromatic.yml
    with:
      package_path: packages/design-system/vuotto-web
      tokens_path: packages/design-system/vuotto-tokens
      display_name: Vuotto Web
      emoji: "📖"
    secrets:
      chromatic_project_token: ${{ secrets.CHROMATIC_PROJECT_TOKEN_VUOTTO_WEB }}
