name: Storybook Industry Web — Chromatic Deploy

on:
  push:
    branches:
      - main
    paths:
      - "packages/design-system/industry/web/**"
      - "packages/design-system/industry/tokens/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/design-system/industry/web/**"
      - "packages/design-system/industry/tokens/**"

jobs:
  chromatic:
    permissions:
      pull-requests: write
    uses: ./.github/workflows/storybook-chromatic.yml
    with:
      package_path: packages/design-system/industry/web
      tokens_path: packages/design-system/industry/tokens
      display_name: Industry Web
      emoji: "📖"
    secrets:
      chromatic_project_token: ${{ secrets.CHROMATIC_PROJECT_TOKEN_INDUSTRY_WEB }}
